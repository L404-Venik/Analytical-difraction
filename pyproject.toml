[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analytical-diffraction"
version = "0.1.0"
description = "Mie-theory electromagnetic scattering simulation and inverse design of multilayer spheres."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
progress = ["tqdm"]
gui = ["PyQt6"]
dev = ["pytest", "tqdm", "PyQt6"]

[tool.setuptools.packages.find]
include = ["analytical_diffraction*"]
